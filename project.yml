# XcodeGen: genera PianoReader.xcodeproj con `xcodegen generate` (instalar con `brew install xcodegen`).
name: PianoReader
options:
  bundleIdPrefix: com.amiguel
  deploymentTarget:
    iOS: "17.0"
targets:
  PianoReader:
    type: application
    platform: iOS
    sources:
      - PianoReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amiguel.pianoreader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lectura Piano
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Para conectar tu piano por Bluetooth MIDI."
